services:
  postgres:
    image: postgres:16
    container_name: geartrack_postgres
    restart: always
    environment:
      POSTGRES_DB: geartrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: GearTrack2026
    ports:
      - "5433:5432"
    volumes:
      - geartrack_data:/var/lib/postgresql/data

volumes:
  geartrack_data:
